<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e3dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191c" media="(prefers-color-scheme: dark)" />
    <!-- Emoji font is self-hosted (public/fonts): no request goes to Google. -->
    <!-- Not render-blocking (it only maps the emoji font's files): the splash paints without waiting for it. -->
    <link href="./fonts/noto-color-emoji.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="./fonts/noto-color-emoji.css" rel="stylesheet" /></noscript>
    <meta name="description" content="Learn Dutch for the work floor, through English, with help in your own language." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" href="./icon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3" />
    <title>Vloertaal</title>
    <!-- The start screen before any script has run (and while the help language loads): ink on a
         kraft label on the floor colour, no JavaScript needed, so the screen is never blank.
         src/components/Splash.tsx draws the same thing from React. -->
    <style>
      html, body { margin: 0; background: #e7e3dc; }
      .boot-splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; box-sizing: border-box; padding: 16px; }
      .boot-label { display: inline-flex; align-items: center; gap: 14px; padding: 18px 26px 18px 20px; background: #ebd6b5; border: 2px solid #1e2226; border-radius: 6px; color: #1e2226; transform: rotate(-1.5deg); }
      .boot-label svg { flex: none; border-radius: 22%; }
      .boot-word { font: 700 2.4rem/1 'Lexend Variable', Lexend, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.02em; }
      .boot-dot { color: #c58a00; }
      .boot-retry { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1e2226; background: #fffdf8; color: #1e2226; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #16191c; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #16191c; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash"><div class="boot-label" role="img" aria-label="Vloertaal"><svg viewBox="0 0 120 120" width="64" height="64" aria-hidden="true" focusable="false"><rect width="120" height="120" rx="28" fill="#ffc414"/><g transform="rotate(-10 60 60)" fill="#1e2226"><circle cx="60" cy="60" r="42" fill="none" stroke="#1e2226" stroke-width="9"/><path d="M38 36h14l8 26 8-26h14L68 86H52z"/></g></svg><span class="boot-word" lang="nl" dir="ltr">vloertaal<span class="boot-dot">.</span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
