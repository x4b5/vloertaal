    <noscript><link href="./fonts/noto-color-emoji.css" rel="stylesheet" /></noscript>
    <meta name="description" content="Learn Dutch for the work floor, through English, with help in your own language." />
    <link rel="canonical" href="https://vloertaal.nl/" />
    <!-- Link previews (WhatsApp, Signal, Facebook): the share image and one line in Dutch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vloertaal" />
    <meta property="og:title" content="Vloertaal – Nederlands voor op de werkvloer" />

    <meta property="og:url" content="https://vloertaal.nl/" />
    <meta property="og:image" content="https://vloertaal.nl/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="icon" href="./favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png?v=4" type="image/png" sizes="16x16" />
    <link rel="icon" href="./icon.svg?v=4" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4" />
    <title>Vloertaal</title>
    <!-- The start screen before any script has run (and while the help language loads): the logo
         (Bram) and the name in ink on a kraft label on the floor colour, no JavaScript needed, so
         the screen is never blank.
         src/components/Splash.tsx draws the same thing from React. -->
    <style>
      html, body { margin: 0; background: #e7e3dc; }
      .boot-splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; box-sizing: border-box; padding: 16px; }
      .boot-label { display: inline-flex; align-items: center; gap: 14px; padding: 18px 26px 18px 20px; background: #ebd6b5; border: 2px solid #1e2226; border-radius: 6px; color: #1e2226; transform: rotate(-1.5deg); }
      .boot-label svg { flex: none; border-radius: 22%; }
      .boot-word { font: 700 2.4rem/1 'Lexend Variable', Lexend, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.02em; }
      .boot-dot { color: #c58a00; }
      .boot-failed { margin: 0; max-width: 320px; display: flex; flex-direction: column; gap: 6px; text-align: center; font: 600 1.05rem/1.35 'Lexend Variable', Lexend, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1e2226; }
      .boot-failed > :first-child { font-weight: 700; }
      .boot-retry { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1e2226; background: #fffdf8; color: #1e2226; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #16191c; }
        html:not([data-theme='light']) .boot-failed { color: #ece8e1; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #16191c; }
      html[data-theme='dark'] .boot-failed { color: #ece8e1; }
    </style>
  </head>
