# Bouwinstructies voor statichost.eu (Zweden): zelfde bouw als lokaal, uitvoer in dist/.
# Geen tests hier: op de bouwmachine van statichost lopen een paar zware tests (g4r2Learning,
# pictures) tegen hun tijdslimiet aan, waardoor de site niet meer live ging (23 november 2026).
# De tests draaien in GitHub Actions (.github/workflows/deploy.yml) bij elke pull request en
# elke push naar main: merge alleen als die groen is.
# Beveiliging en bewaartijden: public/_headers. Doorsturen: public/_redirects.
image: node:22
command: npm ci && npm run build
public: dist
