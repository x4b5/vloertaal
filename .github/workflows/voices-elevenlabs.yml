name: Record ElevenLabs voices

# Run by hand (Actions → Record ElevenLabs voices → Run workflow). Records only clips that
# are missing or whose text changed, and commits them to public/audio-el on this branch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = only show cost, sample = a few test lines per voice, all = everything missing or outdated'
        type: choice
        options: [check, sample, all]
        default: check
      voices:
        description: 'Only these voices, comma separated (e.g. thijmen). Empty = all voices'
        default: ''
      max_credits:
        description: 'Stop before spending more than this'
        default: '12000'

permissions:
  contents: write

concurrency:
  group: voices-elevenlabs
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MAX_CREDITS: ${{ inputs.max_credits }}
      VOICES: ${{ inputs.voices }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run clips
      - run: node scripts/voices/elevenlabs.mjs ${{ inputs.mode }}
      - name: Commit the recordings
        if: inputs.mode != 'check'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio-el
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Record ElevenLabs voices (${{ inputs.mode }})"
          # The branch may have moved while recording (e.g. a merged PR): rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      # Keep a copy of every recording run, so paid clips are never lost if the commit fails.
      - uses: actions/upload-artifact@v5
        if: always() && inputs.mode != 'check'
        with:
          name: elevenlabs-${{ inputs.mode }}
          path: public/audio-el/
          retention-days: 30
