name: Flows

# Flow tests (e2e/*.flow.ts, playwright.config.ts): a phone-sized Chromium clicks through the
# production build with its service worker: a first start to a finished lesson 1.1, a reload in
# the middle of a lesson, offline, the work-rules track, the pause sheet. On every push to main
# and on every pull request, next to the unit tests (deploy.yml). About a minute of tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser of the Playwright version in package-lock.json, with what it needs on Ubuntu.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: flows-test-results
          path: test-results/
          retention-days: 7
