name: Test

# The site is hosted on Vercel, which builds and publishes every push to main by itself (and a
# preview for every pull request). This workflow only runs the tests, so a red change shows up
# on the pull request before it is merged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
