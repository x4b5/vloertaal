name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily refresh of the ElevenLabs credit balance on the hidden #beheer page.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Only the credit numbers reach the site, never the key.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch ElevenLabs credits for the admin page
        if: github.ref == 'refs/heads/main' && env.ELEVENLABS_API_KEY != ''
        run: node scripts/fetch-credits.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
