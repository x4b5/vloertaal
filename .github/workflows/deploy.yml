name: Test

# The site is hosted on statichost.eu, which builds and publishes every push to main by itself
# (statichost.yml: npm ci, npm test, npm run build). This workflow only runs the tests, so a red
# change shows up on the pull request before it is merged. The flow tests: flows.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
