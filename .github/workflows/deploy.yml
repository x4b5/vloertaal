name: Test

# The site is hosted on Vercel, which builds and publishes every push to main by itself (and a
# preview for every pull request). This workflow only runs the tests, the build and the size
# check, so a red change shows up on the pull request before it is merged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The build fails on a dynamic import that does not split (vite.config.ts,
      # failOnDynamicImportWarnings); then the size of what a phone downloads must stay under its
      # limits (scripts/bundle-size.mjs: the start file, the start, the whole dist without audio).
      - run: npm run build
      - run: npm run size
